name: Build preview packages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android preview APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      PYTHONUTF8: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run unit and regression tests
        run: python run_tests.py

      - name: Run real plotting cases
        run: python cross_platform_smoke_test.py

      - name: Seed Gradle distribution cache
        env:
          GRADLE_WRAPPER_URL: https://github.com/gradle/gradle-distributions/releases/download/v8.14.0/gradle-8.14-all.zip
        run: |
          CACHE_KEY="$(python -c "import hashlib, numpy as np, os; print(np.base_repr(int(hashlib.md5(os.environ['GRADLE_WRAPPER_URL'].encode()).hexdigest(), 16), 36).lower())")"
          CACHE_DIR="$HOME/.gradle/wrapper/dists/gradle-8.14-all/$CACHE_KEY"
          mkdir -p "$CACHE_DIR"
          curl --fail --location --retry 5 --retry-delay 10 --retry-all-errors \
            https://downloads.gradle.org/distributions/gradle-8.14-all.zip \
            --output "$CACHE_DIR/gradle-8.14-all.zip"

      # No custom keystore is supplied: preview APKs intentionally use debug signing.
      - name: Build debug-signed Android preview APK
        run: |
          for attempt in 1 2 3; do
            if flet build apk . \
              --yes \
              --project plotforge \
              --artifact plotforge \
              --product Plotforge \
              --org com.zz520zz \
              --android-adaptive-icon-background "#081D34" \
              --arch arm64-v8a \
              --android-extract-packages matplotlib \
              --android-legacy-packaging \
              --exclude .flet .venv .git build dist tests docs __pycache__ \
                gui_smoke_test.py test_regressions.py cross_platform_smoke_test.py run_tests.py \
              --no-compile-app \
              --no-rich-output; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Android build failed after 3 attempts."
              exit 1
            fi
            echo "Android build attempt $attempt failed; retrying in 30 seconds."
            sleep 30
          done

      - name: Verify Android debug signature
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs build/apk/plotforge.apk
          SIGNER_DN="$("$APKSIGNER" verify --print-certs build/apk/plotforge.apk | sed -n 's/^Signer #1 certificate DN: //p')"
          echo "Android signer: $SIGNER_DN"
          echo "$SIGNER_DN" | grep -F "CN=Android Debug"

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp build/apk/plotforge.apk "dist/Plotforge-Android-arm64.apk"

      - name: Upload Android package
        uses: actions/upload-artifact@v4
        with:
          name: preview-android-apk
          path: dist/Plotforge-Android-arm64.apk
          if-no-files-found: error
          retention-days: 7
