name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]

    env:
      MPLBACKEND: Agg
      PYTHONUTF8: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run 31 unit and regression tests
        run: python run_tests.py

      - name: Run three real plotting cases
        run: python cross_platform_smoke_test.py

      - name: Upload plotting results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plotting-results-${{ matrix.os }}
          path: build/test-output/*.png
          if-no-files-found: error
